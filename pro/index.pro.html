<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SK AYAAN — Social Links (Pro)</title>
  <meta name="description" content="Official link page for @sk_ayaan99 — Instagram, Threads, X, Facebook, Reddit, Snapchat." />

  <!-- Open Graph -->
  <meta property="og:title" content="SK AYAAN — Social Links" />
  <meta property="og:description" content="Follow @sk_ayaan99 across social platforms." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/logo-pro.svg" />

  <!-- Twitter card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="SK AYAAN — Social Links" />
  <meta name="twitter:description" content="Follow @sk_ayaan99 across social platforms." />

  <!-- Canonical (optional) -->
  <!-- <link rel="canonical" href="https://yourdomain.example/" /> -->

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="styles.pro.css">

  <!-- Minimal JSON-LD for SEO -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "SK AYAAN",
    "url": "",
    "sameAs": [
      "https://www.instagram.com/sk_ayaan99/",
      "https://www.threads.com/@sk_ayaan99",
      "https://x.com/SKAYAAN99"
    ]
  }
  </script>
</head>
<body>
  <main class="wrapper">
    <header class="hero">
      <!-- Profile image: uses profile.jpg if present, falls back to logo-pro.svg -->
      <img id="profileImg" class="logo" src="assets/profile.jpg" alt="Profile" onerror="this.onerror=null;this.src='assets/logo-pro.svg'">
      <h1 class="name">@sk_ayaan99</h1>
      <p class="tagline">Connect with me on social</p>
    </header>

    <section class="links" aria-label="Social links">
      <a class="link" href="https://www.instagram.com/sk_ayaan99/" target="_blank" rel="noopener">
        <i class="fab fa-instagram"></i>
        <span>Instagram</span>
      </a>
      <a class="link" href="https://www.threads.com/@sk_ayaan99" target="_blank" rel="noopener">
        <i class="fa-brands fa-threads"></i>
        <span>Threads</span>
      </a>
      <a class="link" href="https://x.com/SKAYAAN99" target="_blank" rel="noopener">
        <i class="fa-brands fa-x-twitter"></i>
        <span>X (Twitter)</span>
      </a>
      <a class="link" href="https://www.facebook.com/profile.php?id=61581375116801" target="_blank" rel="noopener">
        <i class="fab fa-facebook-f"></i>
        <span>Facebook</span>
      </a>
      <a class="link" href="https://www.reddit.com/user/LargeSong5296/" target="_blank" rel="noopener">
        <i class="fab fa-reddit"></i>
        <span>Reddit</span>
      </a>
      <a class="link" href="https://www.snapchat.com/@skayaan7575" target="_blank" rel="noopener">
        <i class="fab fa-snapchat-ghost"></i>
        <span>Snapchat</span>
      </a>
    </section>

    <section class="contact">
      <h2>Contact</h2>
      <form id="contactForm" class="contact-form" aria-label="Contact form">
        <div class="row">
          <input name="name" type="text" placeholder="Your name" required>
          <input name="email" type="email" placeholder="Email" required>
        </div>
        <textarea name="message" rows="4" placeholder="Message" required></textarea>
        <div class="actions">
          <button type="submit" class="btn-primary">Send</button>
          <div id="status" role="status" aria-live="polite"></div>
        </div>
      </form>
      <p class="note">No server required — the form opens your email client as a fallback.</p>
    </section>

    <footer class="site-footer">
      <small>&copy; <span id="year"></span> SK AYAAN</small>
    </footer>
  </main>

  <script src="script.pro.js"></script>
</body>
</html>
